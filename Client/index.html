<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BankStatement Analytics</title>
    <script>
      // Apply the persisted theme before React mounts to avoid a light flash.
      // usePersistedState JSON-encodes values, hence the JSON.parse.
      try {
        var p = JSON.parse(localStorage.getItem('themePreference') || '"system"');
        if (p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.dataset.theme = 'dark';
      } catch (e) { /* ignore */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
