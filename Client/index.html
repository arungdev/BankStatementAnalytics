<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BankStatement Analytics</title>
    <script>
      // Apply the persisted theme before React mounts to avoid a light flash.
      // usePersistedState JSON-encodes values, hence the JSON.parse.
      try {
        var p = JSON.parse(localStorage.getItem('themePreference') || '"system"');
        if (p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.dataset.theme = 'dark';
      } catch (e) { /* ignore */ }
    </script>
    <style>
      /* Boot splash — shown before React mounts and reused by AuthGate while
         auth status loads, so opening or refreshing shows an animated, themed
         loading experience immediately with no blank or unstyled delay. */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #edeff4;
        gap: 16px;
        z-index: 9999;
      }
      [data-theme="dark"] .boot-splash { background: #0f1117; }
      .boot-logo {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        box-shadow: 0 4px 16px rgba(79, 70, 229, 0.25);
        animation: boot-pulse 1.8s ease-in-out infinite alternate;
      }
      .boot-splash .boot-spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid rgba(79, 70, 229, 0.18);
        border-top-color: #4f46e5;
        opacity: 1;
        animation: boot-spin 0.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      [data-theme="dark"] .boot-splash .boot-spinner {
        border-color: rgba(99, 102, 241, 0.25);
        border-top-color: #6366f1;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-pulse {
        from { transform: scale(0.96); opacity: 0.85; }
        to { transform: scale(1.04); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <img src="/icon-192.png" alt="Bank Analytics" class="boot-logo" />
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
