name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: dotnet run --project Tests/LinuxDeployment -p:ValidationBuild=true
      - name: Configure disposable database secret
        run: |
          mkdir -p secrets
          openssl rand -hex 32 > secrets/db_password.txt
          chmod 700 secrets
          chmod 444 secrets/db_password.txt
      - run: docker compose build
      - run: BSA_DISPOSABLE_TEST=yes bash deploy/smoke-test.sh
      - name: Verify HTTPS proxy and secure cookie
        env:
          APP_DOMAIN: localhost
          ACME_EMAIL: smoke@example.test
        run: |
          docker compose --profile https up -d --wait --wait-timeout 180 caddy
          curl --retry 10 --retry-connrefused --retry-delay 2 -fk https://localhost/api/auth/status
          curl -fk -D .build/tls-headers -c .build/tls-cookie -o /dev/null \
            -H 'Content-Type: application/json' \
            -d '{"username":"deployment-smoke","password":"Synthetic-test-only-42!"}' \
            https://localhost/api/auth/login
          grep -qi '^set-cookie:.*; secure' .build/tls-headers
          curl -fk -b .build/tls-cookie -H 'Origin: https://localhost' \
            -H 'Content-Type: application/json' \
            -d '{"accountHolderName":"HTTPS synthetic","accountNumber":"0000000000","bankName":"HDFC"}' \
            https://localhost/api/accounts
      - if: failure()
        run: docker compose --profile https logs --tail=150
      - if: always()
        run: docker compose --profile https down -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - run: npm ci
      - run: node ../scripts/verify-vendor.mjs
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: node ../Tests/SharedBills/report-range.mjs
      - run: npm run build
  backend:
    # SQLite's vendored native runtime and the portable Windows build run here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project Tests/GPayMatching -p:ValidationBuild=true
      - run: dotnet run --project Tests/SharedBills -p:ValidationBuild=true
      - run: dotnet run --project Tests/ImportReliability -p:ValidationBuild=true
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bsa_regression
          POSTGRES_USER: regression
          POSTGRES_PASSWORD: regression
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U regression -d bsa_regression"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BSA_TEST_POSTGRES: Host=localhost;Port=5432;Database=bsa_regression;Username=regression;Password=regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project Tests/ImportReliability -p:ValidationBuild=true
