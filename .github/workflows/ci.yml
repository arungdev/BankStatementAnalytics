name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -NoProfile -File scripts/verify-common-deployment.ps1
      - run: pwsh -NoProfile -File Tests/DeploymentReuse/package.ps1
      - run: bash Tests/DeploymentReuse/test.sh
      - run: bash Tests/DeploymentReuse/https-session.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core age
      - run: dotnet run --project Tests/LinuxDeployment -p:ValidationBuild=true
      - name: Configure disposable database secret
        run: |
          mkdir -p secrets .build
          openssl rand -hex 32 > secrets/db_password.txt
          openssl rand -hex 32 > secrets/db_operator_password.txt
          chmod 700 secrets
          chmod 444 secrets/db_password.txt
          chmod 444 secrets/db_operator_password.txt
          age-keygen -o .build/backup-test-identity.txt
          age-keygen -y .build/backup-test-identity.txt > secrets/backup-recipients.txt
      - run: docker compose build
      - run: BSA_DISPOSABLE_TEST=yes BACKUP_IDENTITY_FILE="$(pwd)/.build/backup-test-identity.txt" bash deploy/smoke-test.sh
      - name: Verify HTTPS proxy and Google-only cloud policy
        env:
          APP_DOMAIN: localhost
          ACME_EMAIL: smoke@example.test
        run: |
          docker compose --profile https up -d --wait --wait-timeout 180 caddy
          curl --retry 10 --retry-connrefused --retry-delay 2 -fk https://localhost/api/auth/status
          test "$(curl -sk -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"username":"deployment-smoke","password":"Synthetic-test-only-42!"}' \
            https://localhost/api/auth/login)" = 403
          curl -fk https://localhost/api/auth/options | grep -q '"googleOnly":true'
      - if: failure()
        run: docker compose --profile https logs --tail=150
      - if: always()
        run: docker compose --profile https down -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - run: npm ci
      - run: node ../scripts/verify-vendor.mjs
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: node ../Tests/SharedBills/report-range.mjs
      - run: npm run build
  backend:
    # SQLite's vendored native runtime and the portable Windows build run here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: powershell -NoProfile -File Tests/DeploymentReuse/ssh-auth.ps1
      - run: powershell -NoProfile -File Tests/DeploymentReuse/backup-key.ps1
      - run: powershell -NoProfile -File Tests/DeploymentReuse/release-version.ps1
      - run: powershell -NoProfile -File Tests/DeploymentReuse/ssh-launcher.ps1
      - run: powershell -NoProfile -File Tests/DeploymentReuse/google-ssh.ps1
      - run: dotnet run --project Tests/GPayMatching -p:ValidationBuild=true
      - run: dotnet run --project Tests/SharedBills -p:ValidationBuild=true
      - run: dotnet run --project Tests/ImportReliability -p:ValidationBuild=true
      - run: dotnet run --project Tests/SecurityAudit -p:ValidationBuild=true
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bsa_regression
          POSTGRES_USER: regression
          POSTGRES_PASSWORD: regression
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U regression -d bsa_regression"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BSA_TEST_POSTGRES: Host=localhost;Port=5432;Database=bsa_regression;Username=regression;Password=regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project Tests/ImportReliability -p:ValidationBuild=true
