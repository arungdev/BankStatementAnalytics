services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bankstatements
      POSTGRES_USER: bankstatements
      # Local-development default. Override for anything reachable beyond this host,
      # e.g. `POSTGRES_PASSWORD=... docker compose up`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankstatements}
    volumes:
      - bsa-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankstatements -d bankstatements"]
      interval: 5s
      timeout: 5s
      retries: 10

  bankstatementanalytics:
    build: .
    image: bankstatementanalytics:latest
    ports:
      - "8080:8080"
    environment:
      # The image already sets Database__Embedded=false (the bundled embedded PostgreSQL
      # is Windows-only); point it at the db service above. NHibernateHelper reads this
      # via AddEnvironmentVariables, so it overrides appsettings.json.
      Database__Provider: Postgres
      Database__PostgresConnectionString: >-
        Host=db;Port=5432;Database=bankstatements;Username=bankstatements;Password=${POSTGRES_PASSWORD:-bankstatements}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Data Protection keys (so auth cookies survive a restart) and uploaded statements.
      - bsa-data:/app/Data
      - bsa-uploads:/app/Uploads

volumes:
  bsa-db:
  bsa-data:
  bsa-uploads:
