name: bankstatementanalytics
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bankstatements
      POSTGRES_USER: bsa_operator
      POSTGRES_PASSWORD_FILE: /run/secrets/db_operator_password
    secrets: [db_password, db_operator_password]
    volumes:
      - bsa-db:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-application-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bankstatements -d bankstatements"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    cpus: 0.5
    shm_size: 128m
    logging: *logging
    networks: [backend]

  bankstatementanalytics:
    build: .
    image: ${APP_IMAGE:-bankstatementanalytics}:${APP_VERSION:-local}
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      Database__PostgresConnectionString: Host=db;Port=5432;Database=bankstatements;Username=bankstatements;Maximum Pool Size=20;Timeout=15
      Database__PasswordFile: /run/secrets/db_password
      Deployment__PublicHosting: "true"
      AllowedHosts: ${APP_DOMAIN:-localhost};localhost;127.0.0.1
      Deployment__KnownProxy: 172.30.58.254
    secrets: [db_password]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - bsa-data:/app/Data
      - bsa-uploads:/app/Uploads
      - bsa-logs:/app/Logs
      - bsa-sessions:/app/Sessions
    mem_limit: 768m
    cpus: 1.0
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging
    networks: [backend, proxy]

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      APP_UPSTREAM: bankstatementanalytics:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/common/Templates:/etc/caddy/common:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      bankstatementanalytics:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    logging: *logging
    networks:
      proxy:
        ipv4_address: 172.30.58.254

secrets:
  db_operator_password:
    file: ./secrets/db_operator_password.txt
  db_password:
    file: ./secrets/db_password.txt

networks:
  backend:
  proxy:
    ipam:
      config:
        - subnet: 172.30.58.0/24

volumes:
  bsa-db:
  bsa-data:
  bsa-uploads:
  bsa-logs:
  bsa-sessions:
  caddy-data:
  caddy-config:
